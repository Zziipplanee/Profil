<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Irma Mulya Adnandita | Wizarding Profile</title>
  <!-- Google Fonts & Font Awesome Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at top, #1a0b2e 0%, #090314 100%);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(212, 175, 55, 0.25);
      --gold-accent: #ffd700;
      --magic-purple: #9d4edd;
      --glow-shadow: 0 0 25px rgba(157, 78, 221, 0.35);
      --text-main: #f0e6ff;
      --text-muted: #b8a7d1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Background Hogwarts Glowing Elements */
    .bg-glow-1 {
      position: absolute;
      top: 15%;
      left: 20%;
      width: 300px;
      height: 300px;
      background: rgba(157, 78, 221, 0.25);
      filter: blur(120px);
      border-radius: 50%;
      z-index: 0;
    }

    .bg-glow-2 {
      position: absolute;
      bottom: 10%;
      right: 20%;
      width: 250px;
      height: 250px;
      background: rgba(212, 175, 55, 0.15);
      filter: blur(100px);
      border-radius: 50%;
      z-index: 0;
    }

    /* Main Glassmorphism Card */
    .profile-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 450px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: var(--glow-shadow), 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    /* Header Badge & Title */
    .role-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gold-accent);
      border: 1px solid var(--gold-accent);
      padding: 6px 16px;
      border-radius: 50px;
      margin-bottom: 1.2rem;
      background: rgba(255, 215, 0, 0.08);
    }

    .profile-name {
      font-family: 'Cinzel', serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
      margin-bottom: 0.4rem;
      letter-spacing: 1px;
    }

    .profile-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 1.8rem;
    }

    /* Skill Pills Grid */
    .skills-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 2rem;
    }

    .skill-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s ease;
    }

    .skill-pill i {
      color: var(--gold-accent);
    }

    .skill-pill:hover {
      background: rgba(157, 78, 221, 0.2);
      border-color: var(--magic-purple);
      transform: translateY(-2px);
    }

    /* Magical Stats Counter Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 2.2rem;
      background: rgba(0, 0, 0, 0.25);
      padding: 1.2rem 0.8rem;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-item h3 {
      font-family: 'Cinzel', serif;
      font-size: 1.4rem;
      color: var(--gold-accent);
      margin-bottom: 2px;
    }

    .stat-item p {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Glowing Action Button */
    .cta-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, #7b2cbf 0%, #9d4edd 100%);
      color: #ffffff;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 4px 15px rgba(157, 78, 221, 0.4);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .cta-button:hover {
      box-shadow: 0 6px 25px rgba(255, 215, 0, 0.5);
      transform: translateY(-2px);
      background: linear-gradient(135deg, #9d4edd 0%, #c77dff 100%);
    }

    .footer-note {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      font-style: italic;
    }
  </style>
</head>
<body>

  <!-- Ambient Glowing Orbs -->
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- Profile Card Container -->
  <div class="profile-card">
    
    <!-- Role Badge -->
    <span class="role-badge"><i class="fa-solid fa-wand-magic-sparkles"></i> Student Wizard</span>

    <!-- Name & Subtitle -->
    <h1 class="profile-name">IRMA MULYA ADNANDITA</h1>
    <p class="profile-subtitle">Communication & Information Management</p>

    <!-- Skill Pills -->
    <div class="skills-container">
      <span class="skill-pill"><i class="fa-solid fa-cloud"></i> Cloud Computing</span>
      <span class="skill-pill"><i class="fa-solid fa-code"></i> Web Development</span>
      <span class="skill-pill"><i class="fa-solid fa-database"></i> Data Systems</span>
      <span class="skill-pill"><i class="fa-solid fa-camera"></i> Muggle Lens</span>
    </div>

    <!-- Magical Stats -->
    <div class="stats-grid">
      <div class="stat-item">
        <h3>100+</h3>
        <p>Spells Cast</p>
      </div>
      <div class="stat-item">
        <h3>174+</h3>
        <p>Skills Acquired</p>
      </div>
      <div class="stat-item">
        <h3>50%</h3>
        <p>Coffee Energy</p>
      </div>
    </div>

    <!-- Call to Action Button -->
    <a href="mailto:irmamulya0179@gmail.com" class="cta-button">
      <i class="fa-solid fa-paper-plane"></i> Send Owl Message
    </a>

    <!-- Footer Quote -->
    <p class="footer-note">✨ Still waiting for my Hogwarts acceptance letter...</p>
    
  </div>

</body>
</html>
